# Docker Compose pour DEVELOPPEMENT LOCAL uniquement.
# En production, Coolify gere le build, le deploy et le reverse proxy.

services:
  db:
    image: postgres:16-alpine
    container_name: riftbound-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=riftbound
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
